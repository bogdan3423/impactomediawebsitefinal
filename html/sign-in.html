  <meta charset="utf-8">

  <meta property="og:url" content="https://impactomedia.ro/html/sign-in.html">
  <meta property="og:image" content="https://impactomedia.ro/assets/images/logos/logoimpactomedia.png">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

</head>

<body>

  <!--  Page Wrapper -->
  <main class="page-wrapper overflow-hidden" id="main-content">

    <!--  Get in touch Section -->
    <section
      class="bg-light-gray border-top border-primary border-4 d-flex align-items-center justify-content-center min-vh-100">
      <div class="container py-3">
        <div class="sign-in card mx-auto shadow-lg">
          <div class="card-body py-8 px-lg-5">
            <a href="index.html" class="mb-8 hstack justify-content-center">
              <img src="../assets/images/logos/logoimpactomedia.png" alt="ImpactoMedia" class="img-fluid">
            </a>
            <div class="hstack gap-3">
              <a href="javascript:void(0)"
                class="btn btn-outline-light bg-white px-3 py-2 fs-4 text-dark w-50 fw-medium hstack gap-2 lh-lg justify-content-center">Continuă
                cu <img src="../assets/images/svgs/icon-google.svg" alt="Google" class="img-fluid"></a>
              <a href="javascript:void(0)"
                class="btn btn-outline-light bg-white px-3 py-2 fs-4 text-dark w-50 fw-medium hstack gap-2 lh-lg justify-content-center">Continuă
                cu <img src="../assets/images/svgs/icon-github.svg" alt="GitHub" class="img-fluid"></a>
            </div>
            <div class="position-relative hstack justify-content-center">
              <hr class="my-8 w-100 d-block">
              <p class="mb-0 fs-3 bg-body px-3 position-absolute top-50 start-50 translate-middle">SAU</p>
            </div>
            <form class="d-flex flex-column gap-3">
              <div>
                <label class="visually-hidden" for="signInEmail">E-mail</label>
                <input type="email" class="form-control border-bottom" id="signInEmail" name="email"
                  placeholder="E-mail" autocomplete="email">
              </div>
              <div>
                <label class="visually-hidden" for="signInPassword">Parolă</label>
                <input type="password" class="form-control border-bottom" id="signInPassword" name="password"
                  placeholder="Parolă" autocomplete="current-password">
              </div>

              <a href="index.html" class="btn btn-dark w-100 justify-content-center py-2 fw-medium my-7 fs-4 lh-lg">
                Autentificare
              </a>
            </form>
            <a class="text-center mb-1 d-block text-dark fw-medium" href="#">Ai uitat parola?</a>
            <p class="mb-0 fw-medium text-center">Nu ai încă un cont? <a class="text-dark" href="sign-up.html">Înregistrare</a>
            </p>
          </div>
        </div>
      </div>
    </section>

  </main>

  <div class="get-template hstack gap-2">

    <button class="btn bg-primary p-2 round-52 rounded-circle hstack justify-content-center flex-shrink-0"
      id="scrollToTopBtn" aria-label="Înapoi sus">
      <iconify-icon icon="lucide:arrow-up" class="fs-7 text-dark"></iconify-icon>
    </button>
  </div>


  <script defer src="../assets/libs/jquery/dist/jquery.min.js"></script>
  <script defer src="../assets/libs/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
  <script defer src="../assets/libs/aos-master/dist/aos.js"></script>
  <script defer src="../assets/js/custom.js"></script>
  <!-- solar icons -->
  <script defer src="https://cdn.jsdelivr.net/npm/iconify-icon@1.0.8/dist/iconify-icon.min.js"></script>
</body>

</html>
